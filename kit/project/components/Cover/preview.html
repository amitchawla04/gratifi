<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Gratifi UI Kit</title>
<style>
  html, body { margin:0; height:100%; }
  body { background:var(--ground); color:var(--ink); font-family:var(--font-sans); overflow:hidden; }
  .cover { position:relative; width:960px; height:288px; overflow:hidden; }
  .art { position:absolute; top:0; left:480px; width:480px; height:288px; }
  .art svg { display:block; width:480px; height:288px; }
  .accent { fill:var(--accent); }
  .pill { fill:var(--pill); }
  .note { fill:var(--sticky-yellow); }
  .blue { fill:var(--sticky-blue); }
  .slab { rx:var(--radius-xl); }
  .paper { rx:var(--radius-xs); }
  .tile { rx:var(--radius-md); }
  line { stroke-width:5; stroke-linecap:round; }
  line.on { stroke:var(--accent); }
  line.off { stroke:var(--ink-faint); stroke-width:3.5; }
  .words { position:absolute; left:var(--space-8); bottom:var(--space-8); max-width:440px; }
  .name { margin:0; font-size:104px; line-height:.92; font-weight:800; letter-spacing:-.035em; color:var(--ink); }
  .tag { margin:var(--space-3) 0 0 4px; font-size:14px; line-height:20px; font-weight:500; color:var(--ink-soft); }
</style>
</head>
<body>
<div class="cover">
<div class="art" aria-hidden="true">
<svg viewBox="0 0 480 288" width="480" height="288">
<!--
  blocks      accent 144×240 slab bled off the top (the one hot colour, largest) · pill disc r80 (the black pill, the dial's core) · sticky-yellow 128×104 note bled off the bottom · sticky-blue 72×72 tile bled off the right; about 35% of 960×288
  arrangement one tall accent slab with the disc and two paper satellites; the note tilts -5deg, the only thing in the UI that tilts
  pattern     dial ticks, from "one hot colour marks selection and progress": 30 rounded ticks on a 260deg arc around the disc, the first 64% in accent, the rest ink-faint
  scales      slab corners radius-xl, note radius-xs, tile radius-md; slab and note sides in space-4 multiples; tick ring 94 to 110 around an 80 core, as in Dial
-->
